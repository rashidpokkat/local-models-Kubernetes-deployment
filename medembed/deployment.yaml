apiVersion: apps/v1
kind: Deployment
metadata:
  name: medembed
  namespace: medembed
  labels:
    app.kubernetes.io/name: medembed
    app.kubernetes.io/component: embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: medembed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: medembed
        app.kubernetes.io/component: embeddings
    spec:
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
          args:
            - --model-id
            - abhinand/MedEmbed-base-v0.1
            - --port
            - "80"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
            - name: OMP_NUM_THREADS
              value: "4"
            - name: MKL_NUM_THREADS
              value: "4"
            - name: RAYON_NUM_THREADS
              value: "4"
          volumeMounts:
            - name: model-cache
              mountPath: /data
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
      volumes:
        - name: model-cache
          emptyDir: {}
