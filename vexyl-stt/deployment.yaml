apiVersion: apps/v1
kind: Deployment
metadata:
  name: vexyl-stt
  namespace: vexyl-stt
  labels:
    app.kubernetes.io/name: vexyl-stt
    app.kubernetes.io/component: speech-to-text
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vexyl-stt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vexyl-stt
        app.kubernetes.io/component: speech-to-text
    spec:
      containers:
        - name: vexyl-stt
          # Replace YOUR_ACR with your Azure Container Registry name before apply.
          image: YOUR_ACR.azurecr.io/vexyl-stt:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: VEXYL_STT_HOST
              value: "0.0.0.0"
            - name: VEXYL_STT_DEVICE
              value: "cpu"
            - name: VEXYL_STT_DECODE
              value: "ctc"
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              cpu: "8"
              memory: 16Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
